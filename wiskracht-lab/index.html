<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiskracht LAB v3</title>
<style>
  :root{
    --bg:#f5f6f7; --card:#ffffff; --ink:#1f2933; --muted:#5f6b76;
    --line:#d7dce0; --dark:#2f3438; --light:#eceff1; --ok:#dff3e4;
    --warn:#fff2cc; --bad:#fde2e2; --shadow:0 2px 10px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Lato,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.5}
  button,input,select{font:inherit}
  button{cursor:pointer}
  .topbar{background:#23272a;color:white;padding:14px 20px;position:sticky;top:0;z-index:10}
  .topbar-inner{max-width:1100px;margin:auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
  .brand{font-weight:800;letter-spacing:.2px}.brand small{font-weight:400;opacity:.8;margin-left:8px}
  .nav{display:flex;gap:8px;flex-wrap:wrap}
  .nav button{background:#3a4146;border:1px solid #596168;color:white;border-radius:8px;padding:8px 11px}
  .nav button:hover{background:#4a535a}
  main{max-width:1100px;margin:24px auto;padding:0 18px 60px}
  .hero,.panel,.topic-card,.question-card,.stat-card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  .hero{padding:24px;margin-bottom:20px}
  h1,h2,h3{line-height:1.2;margin-top:0}
  h1{font-size:32px} h2{font-size:25px} h3{font-size:20px}
  .muted{color:var(--muted)}
  .level-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
  .level{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fafafa}
  .level strong{display:block;font-size:18px}
  .topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
  .topic-card{padding:18px;display:flex;flex-direction:column;gap:10px}
  .topic-card .code{font-size:13px;color:#66717c;font-weight:700}
  .topic-card .criterion{min-height:72px}
  .progressbar{height:8px;background:#e7eaed;border-radius:999px;overflow:hidden}
  .progressbar > span{display:block;height:100%;background:#4b5963}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:1px solid #495057;background:white;color:#222;border-radius:8px;padding:9px 13px;font-weight:700}
  .btn.primary{background:#2f3438;color:white}
  .btn.soft{background:#f2f4f5}
  .btn.bronze{background:#f7eee5}.btn.silver{background:#eef0f2}.btn.gold{background:#fbf2cc}
  .panel{padding:20px;margin-bottom:16px}
  .theory-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
  .theory-box{border-left:5px solid #6b737a;background:#f8f9fa;padding:14px 16px;border-radius:8px}
  .example{background:#fff;border:1px solid var(--line);padding:14px;border-radius:8px;margin:10px 0}
  .video-link{display:inline-block;margin:6px 0;padding:9px 12px;border-radius:8px;border:1px solid #b8c0c7;text-decoration:none;color:#1f2933;background:#fff}
  .video-link:hover{background:#f2f4f5}
  .level-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .level-buttons button{padding:14px;border-radius:10px;border:1px solid var(--line);font-weight:800}
  .question-card{padding:22px}
  .question-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
  .pill{border:1px solid #aab2b8;border-radius:999px;padding:4px 9px;font-size:13px;font-weight:800;white-space:nowrap;background:#f7f8f9}
  .prompt{font-size:20px;font-weight:700;margin:10px 0 16px}
  .visual{margin:14px 0;overflow-x:auto}
  .answer-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
  .answer-row input{max-width:220px;border:1px solid #9fa8af;border-radius:8px;padding:10px 12px;background:white}
  .choice-list{display:grid;gap:9px;margin-top:12px}
  .choice{border:1px solid #aeb5bb;border-radius:9px;background:white;padding:12px;text-align:left}
  .choice:hover{background:#f5f7f8}
  .choice.selected{outline:3px solid #4b5963}
  .feedback{margin-top:16px;padding:14px;border-radius:9px;border:1px solid var(--line)}
  .feedback.ok{background:var(--ok)} .feedback.bad{background:var(--bad)} .feedback.hint{background:var(--warn)}
  .solution{margin-top:10px;background:#f8f9fa;border:1px dashed #aab2b8;padding:12px;border-radius:8px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .stat-card{padding:15px}
  .stat-big{font-size:28px;font-weight:900}
  table{border-collapse:collapse;width:100%} th,td{border:1px solid #b8c0c7;padding:8px;text-align:left}
  th{background:#eceff1}
  .svg-wrap{max-width:520px;background:white;border:1px solid #cdd3d8;border-radius:8px;padding:8px}
  .mini-grid{display:inline-grid;grid-template-columns:repeat(3,34px);gap:2px;background:#333;padding:2px;vertical-align:middle}
  .mini-grid span{width:34px;height:34px;background:white;display:flex;align-items:center;justify-content:center;font-weight:700}
  .mini-grid span.on{background:#9ea7ae}
  .profile{display:flex;align-items:flex-end;gap:4px;height:90px;padding:8px;border:1px solid #cdd3d8;width:max-content;background:#fff}
  .profile span{width:28px;background:#7f8a92;display:block}
  .note{font-size:14px;color:#5d6872}
  .hidden{display:none!important}
  .empty{padding:20px;text-align:center;color:#69747d}
  .footer-note{margin-top:28px;font-size:13px;color:#6f7980}

  .video-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:12px}
  .video-card{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
  .video-card iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#111}
  .video-info{padding:12px}
  .video-info strong{display:block;margin-bottom:4px}
  .video-info a{display:inline-block;margin-top:8px;color:#24313a;font-weight:700}
  .video-note{font-size:14px;color:#5d6872;margin-top:4px}
  @media(max-width:760px){
    .theory-grid,.grid2,.level-strip,.level-buttons{grid-template-columns:1fr}
    .question-head{flex-direction:column}
    body{font-size:16px}.prompt{font-size:18px}
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">Wiskracht LAB <small>4A · PAV wiskunde · v3</small></div>
    <div class="nav">
      <button onclick="goHome()">Start</button>
      <button onclick="startMixed()">Zilvermix</button>
      <button onclick="showTeacher()">Mijn voortgang</button>
    </div>
  </div>
</div>

<main id="app"></main>

<script>
const TOPICS = {
  sc1: {
    code:"BV2_06.01", short:"Rekenen",
    title:"Rekenen in betekenisvolle situaties",
    criterion:"Ik voer met mijn rekenmachine eenvoudige berekeningen uit met gehele getallen, decimalen, breuken, procenten en verhoudingen.",
    theory:`
      <div class="theory-box">
        <strong>Kern</strong>
        <p>Lees eerst wat je moet zoeken. Kies daarna de bewerking. Je rekenmachine helpt bij het rekenen, maar kiest de bewerking niet voor jou.</p>
        <p><strong>Procent:</strong> 25% = 25/100 = 0,25. Dus 25% van €64 = 0,25 × 64.</p>
        <p><strong>Breuk:</strong> 3/5 van 45 = 45 ÷ 5 × 3.</p>
        <p><strong>Verhouding 2 : 3:</strong> samen zijn dat 5 gelijke delen.</p>
      </div>
      <div class="example"><strong>Voorbeeld zilver</strong><br>Een trui kost €80 en is 25% afgeprijsd. Korting = 0,25 × 80 = €20. Nieuwe prijs = €60.</div>`,
    videos:[["Procenten – rekenen met percentages (WiskundeAcademie)","https://www.youtube.com/watch?v=SXT53Be6VEA"]],
    qs:{bronze:[],silver:[],gold:[]}
  },
  sc2: {
    code:"BV2_06.02", short:"Schatten & afronden",
    title:"Schatten en zinvol afronden",
    criterion:"Ik schat resultaten en rond antwoorden zinvol af in concrete situaties.",
    theory:`
      <div class="theory-box">
        <strong>Kern</strong>
        <p><strong>Schat eerst</strong> met eenvoudige getallen. Bereken daarna exact. Vergelijk beide antwoorden.</p>
        <p>Rond niet automatisch af: kijk naar de situatie. 8,3 flessen betekent bijvoorbeeld <strong>9 flessen kopen</strong>, want je kunt geen 0,3 fles kopen en je mag niet tekortkomen.</p>
      </div>
      <div class="example"><strong>Voorbeeld zilver</strong><br>17 spelers drinken elk 0,75 L. Dat is 12,75 L. Flessen zijn 1,5 L: 12,75 ÷ 1,5 = 8,5. Je koopt 9 flessen.</div>`,
    videos:[],
    qs:{bronze:[],silver:[],gold:[]}
  },
  sc3: {
    code:"BV2_06.03", short:"3D ↔ 2D",
    title:"Van een 3D-situatie naar een 2D-voorstelling",
    criterion:"Ik verbind een 3D-situatie met de juiste 2D-voorstelling.",
    theory:`
      <div class="theory-box">
        <strong>Kern</strong>
        <p><strong>Bovenaanzicht:</strong> je kijkt van boven. Je ziet welke plaatsen op de grond bezet zijn, maar niet automatisch hoeveel blokken er boven elkaar staan.</p>
        <p><strong>Vooraanzicht:</strong> je kijkt recht van voren. Per kolom zie je de grootste hoogte.</p>
        <p><strong>Zijaanzicht:</strong> hetzelfde principe, maar van opzij.</p>
      </div>
      <div class="example"><strong>Belangrijk</strong><br>Twee stapelingen kunnen hetzelfde bovenaanzicht hebben, maar toch verschillen in hoogte.</div>`,
    videos:[["Aanzichten tekenen – vooraanzicht, zijaanzicht, bovenaanzicht","https://www.youtube.com/watch?v=HVltCPFByJ4"]],
    qs:{bronze:[],silver:[],gold:[]}
  },
  sc4: {
    code:"BV2_06.04", short:"Gegevens & grafieken",
    title:"Grafieken, tabellen, frequenties en formules",
    criterion:"Ik interpreteer grafieken, tabellen, diagrammen en eenvoudige formules en herken misleidende voorstellingen.",
    theory:`
      <div class="theory-box">
        <strong>Kern</strong>
        <p><strong>Absolute frequentie = aantal.</strong></p>
        <p><strong>Relatieve frequentie = deel van het totaal</strong>, vaak als percentage.</p>
        <p>Voorbeeld: 8 van 20 leerlingen kiezen voetbal. Absolute frequentie = 8. Relatieve frequentie = 8 ÷ 20 × 100 = 40%.</p>
        <p>Bij grafieken controleer je titel, labels, schaal, beginpunt van de y-as en of balken eerlijk getekend zijn.</p>
      </div>
      <div class="example"><strong>Misleiding</strong><br>84 en 92 verschillen 8 punten. Als de y-as pas bij 80 start, lijkt dat verschil veel groter dan wanneer de y-as bij 0 start.</div>`,
    videos:[],
    qs:{bronze:[],silver:[],gold:[]}
  },
  sc5: {
    code:"BV2_06.05", short:"Gemiddelde & mediaan",
    title:"Gemiddelde en mediaan interpreteren",
    criterion:"Ik interpreteer de mediaan en het rekenkundig gemiddelde van numerieke gegevens.",
    theory:`
      <div class="theory-box">
        <strong>Gemiddelde</strong><p>Tel alle waarden op en deel door het aantal waarden.</p>
        <strong>Mediaan</strong><p>Zet de waarden van klein naar groot. De middelste waarde is de mediaan.</p>
        <p>Een uitschieter beïnvloedt het gemiddelde vaak sterker dan de mediaan.</p>
      </div>
      <div class="example"><strong>Voorbeeld</strong><br>2, 3, 3, 4, 8 → gemiddelde = 4; mediaan = 3. Door de 8 ligt het gemiddelde hoger.</div>`,
    videos:[
      ["Mediaan – WiskundeAcademie","https://www.youtube.com/watch?v=-A7Oveo3TZI"],
      ["Rekenkundig gemiddelde – uitlegvideo","https://www.youtube.com/watch?v=GWDqQ7TMsG8"]
    ],
    qs:{bronze:[],silver:[],gold:[]}
  },
  sc6: {
    code:"BV2_06.06", short:"Problemen oplossen",
    title:"Wiskundige problemen oplossen",
    criterion:"Ik los problemen uit herkenbare situaties op door passende wiskunde te gebruiken.",
    theory:`
      <div class="theory-box">
        <strong>Werk in drie stappen</strong>
        <p>1. <strong>Selecteer:</strong> welke gegevens heb je nodig?</p>
        <p>2. <strong>Bereken:</strong> welke bewerking(en) passen?</p>
        <p>3. <strong>Controleer:</strong> past je antwoord bij de situatie en moet je afronden?</p>
      </div>
      <div class="example"><strong>Voorbeeld zilver</strong><br>17 personen krijgen 180 g pasta. Totaal = 3060 g. Pakken zijn 500 g: 3060 ÷ 500 = 6,12, dus je koopt 7 pakken.</div>`,
    videos:[],
    qs:{bronze:[],silver:[],gold:[]}
  }
};

const rint=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const choice=a=>a[Math.floor(Math.random()*a.length)];
const euro=n=>"€ "+n.toFixed(2).replace(".",",");
const round2=n=>Math.round(n*100)/100;
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const gcd=(a,b)=>b?gcd(b,a%b):a;
const pct=(part,total)=>Math.round(part/total*100);
const letter=i=>"ABCDEFGHI"[i];

function numQ(prompt,answer,unit,hint,solution,visual=""){
  return {type:"number",prompt,answer,tolerance:0.011,unit:unit||"",hint,solution,visual};
}
function chQ(prompt,options,answerIndex,hint,solution,visual=""){
  return {type:"choice",prompt,options,answerIndex,hint,solution,visual};
}
function randPrice(min=10,max=100){return rint(min*20,max*20)/20}
function formatMinutes(m){const h=Math.floor(m/60), min=m%60; return `${h} u ${String(min).padStart(2,"0")} min`}

function barChart(labels,vals,ymin=0,ymax=null,title=""){
  ymax=ymax??Math.ceil(Math.max(...vals)/10)*10;
  if(ymax===ymin)ymax=ymin+10;
  const w=480,h=245,pad=42,bw=45,gap=(w-2*pad-labels.length*bw)/(labels.length-1||1);
  let bars="",texts="";
  vals.forEach((v,i)=>{
    const x=pad+i*(bw+gap), y=25+(ymax-v)/(ymax-ymin)*160, bh=185-y;
    bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="#7f8a92"></rect>`;
    texts+=`<text x="${x+bw/2}" y="210" text-anchor="middle" font-size="12">${labels[i]}</text><text x="${x+bw/2}" y="${Math.max(18,y-5)}" text-anchor="middle" font-size="12">${v}</text>`;
  });
  return `<div class="svg-wrap"><svg viewBox="0 0 ${w} ${h}" width="100%" aria-label="staafdiagram">
  <text x="${w/2}" y="16" text-anchor="middle" font-weight="700" font-size="14">${title}</text>
  <line x1="${pad}" y1="25" x2="${pad}" y2="185" stroke="#333"/><line x1="${pad}" y1="185" x2="${w-pad+8}" y2="185" stroke="#333"/>
  <text x="8" y="30" font-size="11">${ymax}</text><text x="8" y="185" font-size="11">${ymin}</text>${bars}${texts}</svg></div>`;
}
function lineChart(labels,vals,title=""){
  const w=480,h=245,pad=45,max=Math.ceil(Math.max(...vals)/10)*10;
  const pts=vals.map((v,i)=>[pad+i*((w-2*pad)/(vals.length-1)),185-v/max*150]);
  const poly=pts.map(p=>p.join(",")).join(" ");
  let extras="";
  pts.forEach((p,i)=>extras+=`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#59656d"/><text x="${p[0]}" y="210" text-anchor="middle" font-size="12">${labels[i]}</text><text x="${p[0]}" y="${p[1]-9}" text-anchor="middle" font-size="12">${vals[i]}</text>`);
  return `<div class="svg-wrap"><svg viewBox="0 0 ${w} ${h}" width="100%"><text x="${w/2}" y="16" text-anchor="middle" font-weight="700" font-size="14">${title}</text><line x1="${pad}" y1="30" x2="${pad}" y2="185" stroke="#333"/><line x1="${pad}" y1="185" x2="${w-pad+8}" y2="185" stroke="#333"/><polyline points="${poly}" fill="none" stroke="#59656d" stroke-width="3"/>${extras}</svg></div>`;
}
function topGrid(grid){
  let s=`<div class="mini-grid">`;
  for(let r=0;r<3;r++)for(let c=0;c<3;c++)s+=`<span class="${grid[r][c]>0?"on":""}"></span>`;
  return s+"</div>";
}
function profileView(vals){
  return `<div class="profile">${vals.map(v=>`<span style="height:${v*24}px" title="${v}"></span>`).join("")}</div>`;
}
function blockScene(grid){
  const size=28, ox=150, oy=48;
  let cubes=[];
  for(let r=2;r>=0;r--) for(let c=0;c<3;c++) for(let z=0;z<grid[r][c];z++) cubes.push({r,c,z,ord:r+c+z*.01});
  cubes.sort((a,b)=>a.ord-b.ord);
  let shapes="";
  for(const q of cubes){
    const x=ox+(q.c-q.r)*size*.72, y=oy+(q.c+q.r)*size*.38-q.z*size*.72;
    const a=size*.72,b=size*.38,hh=size*.72;
    const top=`${x},${y} ${x+a},${y+b} ${x},${y+2*b} ${x-a},${y+b}`;
    const left=`${x-a},${y+b} ${x},${y+2*b} ${x},${y+2*b+hh} ${x-a},${y+b+hh}`;
    const right=`${x},${y+2*b} ${x+a},${y+b} ${x+a},${y+b+hh} ${x},${y+2*b+hh}`;
    shapes+=`<polygon points="${left}" fill="#8d989f" stroke="#4c555b"/><polygon points="${right}" fill="#aab2b8" stroke="#4c555b"/><polygon points="${top}" fill="#d9dee1" stroke="#4c555b"/>`;
  }
  return `<div class="svg-wrap" style="max-width:360px"><svg viewBox="0 0 300 250" width="100%">${shapes}<text x="18" y="232" font-size="13" font-weight="700">VOORKANT</text><path d="M90 225 L145 225" stroke="#333" stroke-width="2"/><path d="M145 225 l-10 -6 v12 z" fill="#333"/></svg></div>`;
}
function frontProfile(grid){return [0,1,2].map(c=>Math.max(grid[0][c],grid[1][c],grid[2][c]))}
function sideProfile(grid){return [0,1,2].map(r=>Math.max(grid[r][0],grid[r][1],grid[r][2]))}
function occupied(grid){return grid.map(row=>row.map(v=>v>0?1:0))}
function same(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function mutateOcc(g){
  const out=g.map(r=>r.slice()); let r=rint(0,2),c=rint(0,2); out[r][c]=out[r][c]?0:1; return out;
}
function gridRandom(){
  let g=Array.from({length:3},()=>Array.from({length:3},()=>Math.random()<.48?rint(1,3):0));
  if(g.flat().filter(Boolean).length<3) return [[1,0,2],[0,2,0],[1,1,0]];
  return g;
}

// SC1
TOPICS.sc1.qs.bronze=[
()=>{let a=randPrice(8,35),b=randPrice(12,60);return numQ(`Een T-shirt kost ${euro(a)} en een broek ${euro(b)}. Hoeveel betaal je samen?`,round2(a+b),"euro","Tel beide prijzen op.",`${euro(a)} + ${euro(b)} = ${euro(a+b)}.`)},
()=>{let total=choice([20,24,28,32,36,40]),den=choice([2,4,5]),num=choice([1,3]); if(num>=den)num=1; let ans=total/den*num; return numQ(`${num}/${den} van ${total} drinkflessen wordt gebruikt. Hoeveel flessen zijn dat?`,ans,"flessen",`Deel ${total} eerst door ${den} en vermenigvuldig daarna met ${num}.`,`${total} ÷ ${den} × ${num} = ${ans}.`)},
()=>{let base=choice([4,5,6]),need=choice([2,3]),people=base*rint(3,6);let ans=people/base*need;return numQ(`Voor ${base} spelers zijn ${need} grote waterflessen nodig. Hoeveel zijn er nodig voor ${people} spelers?`,ans,"flessen",`Bepaal hoeveel groepen van ${base} er in ${people} zitten.`,`${people} ÷ ${base} × ${need} = ${ans}.`)}
];
TOPICS.sc1.qs.silver=[
()=>{let a=randPrice(30,80),b=randPrice(15,50),c=randPrice(8,30),pay=Math.ceil((a+b+c)/50)*50+50,ans=round2(pay-a-b-c);return numQ(`Je koopt schoenen van ${euro(a)}, een shirt van ${euro(b)} en een riem van ${euro(c)}. Je betaalt met € ${pay}. Hoeveel krijg je terug?`,ans,"euro","Bereken eerst de totale prijs en trek die af van het betaalde bedrag.",`Totaal = ${euro(a+b+c)}. Terug = € ${pay} − ${euro(a+b+c)} = ${euro(ans)}.`)},
()=>{let p=choice([48,56,64,72,80,96]),discount=choice([15,20,25,30]),ans=round2(p*(1-discount/100));return numQ(`Een hoodie kost € ${p}. Tijdens de solden krijg je ${discount}% korting. Hoeveel betaal je?`,ans,"euro",`Bereken eerst ${discount}% van € ${p}. Trek de korting daarna af.`,`${discount}% van ${p} = ${round2(p*discount/100)}. Te betalen = ${euro(ans)}.`)},
()=>{let total=choice([35,40,45,50,60]),den=choice([4,5]),num=choice([2,3]); if(num>=den)num=den-1; let used=total/den*num,ans=total-used;return numQ(`Een watertank bevat ${total} liter. Tijdens een activiteit wordt ${num}/${den} van het water gebruikt. Hoeveel liter blijft over?`,ans,"liter",`Bereken eerst hoeveel liter gebruikt wordt. Trek dat af van ${total}.`,`Gebruikt: ${total} ÷ ${den} × ${num} = ${used} L. Over: ${total} − ${used} = ${ans} L.`)},

()=>{let w=rint(4,8),d=rint(1,4),ans=3*w+d;return numQ(`Formule: punten = 3 × gewonnen + gelijk. Een ploeg wint ${w} keer en speelt ${d} keer gelijk. Bereken de punten.`,ans,"punten","Vervang de woorden in de formule door de aantallen.",`3 × ${w} + ${d} = ${ans}.`)},
()=>{let total=40,a=choice([8,10,12,16]),b=total-a;return chQ(`Categorie A komt ${a} keer voor op ${total} waarnemingen. Welke combinatie klopt?`,[`absolute = ${a}; relatieve = ${a/total*100}%`,`absolute = ${a/total*100}; relatieve = ${a}%`,`absolute = ${b}; relatieve = ${a}%`],0,"Absoluut is het aantal; relatief is het percentage.",`${a}/${total} × 100 = ${a/total*100}%.`)}
);
TOPICS.sc4.qs.gold.push(
()=>{let total=80,p=35,calc=total*p/100,shown=calc+3;return chQ(`Een verslag zegt dat ${p}% van ${total} leerlingen optie A kiest. Een grafiek toont ${shown} leerlingen. Kunnen beide kloppen?`,["Ja","Nee"],1,"Bereken het aantal dat bij het percentage hoort.",`${p}% van ${total} = ${calc}. ${shown} kan dus niet dezelfde gegevens voorstellen.`)},
()=>{let vals=[82,88];return chQ(`Welke beschrijving geeft een eerlijke grafiek van 82 en 88?`,["Y-as 0–100, gelijke balkbreedtes en duidelijke labels","Y-as 80–90 en een extra brede balk voor 88","Geen cijfers op de y-as"],0,"Eerlijk betekent dat de schaal transparant is en verschillen niet kunstmatig worden uitvergroot.","De eerste voorstelling is het meest transparant.")},
()=>{let n=50,p=60,abs=n*p/100;return chQ(`Een tabel geeft absolute frequentie ${abs} op totaal ${n}. Een cirkeldiagram toont 60%. Welke controle is het sterkst?`,[`${abs} ÷ ${n} × 100 = 60%`,`60 ÷ ${abs} = ${round2(60/abs)}`,`${n} − ${abs} = ${n-abs}`],0,"Controleer of absoluut en relatief bij elkaar passen.",`${abs} ÷ ${n} × 100 = 60%.`)}
);

// ---- SC5 extra ----
TOPICS.sc5.qs.bronze.push(
()=>{let arr=[4,5,6,7,8],ans=6;return numQ(`Wat is de mediaan van ${arr.join(", ")}?`,ans,"","Bij vijf geordende getallen is het derde getal de mediaan.","De mediaan is 6.")},
()=>{let arr=[12,18,24],ans=18;return numQ(`Wat is het gemiddelde van ${arr.join(", ")}?`,ans,"","Tel op en deel door 3.",`(${arr.join(" + ")}) ÷ 3 = ${ans}.`)},
()=>{let arr=shuffle([20,25,30,35,40]);return chQ(`Wat moet je eerst doen om de mediaan van ${arr.join(", ")} te vinden?`,["Van klein naar groot ordenen","Alles vermenigvuldigen","Alle waarden afronden"],0,"De mediaan is de middelste waarde in een geordende reeks.","Orden de waarden eerst van klein naar groot.")}
);
TOPICS.sc5.qs.silver.push(
()=>{let arr=[6,7,7,8,17],avg=9,med=7;return chQ(`Gegevens: ${arr.join(", ")}. Gemiddelde = ${avg}, mediaan = ${med}. Welke maat geeft een typische waarde beter weer?`,["Gemiddelde","Mediaan"],1,"17 ligt ver van de andere waarden.","De mediaan wordt minder sterk beïnvloed door de uitschieter 17.")},
()=>{let arr=[18,20,21,22,24],sum=arr.reduce((a,b)=>a+b,0),avg=sum/5;return numQ(`Bereken het gemiddelde van ${arr.join(", ")}.`,avg,"","Tel alle vijf waarden op en deel door 5.",`${sum} ÷ 5 = ${avg}.`)},
()=>{let arr=[12,14,15,15,44],med=15;return numQ(`Wat is de mediaan van ${arr.join(", ")}?`,med,"","De waarden staan al in volgorde. Neem de middelste.","De derde waarde is 15.")},
()=>{let A=[2,4,4,4,6],B=[1,2,4,7,11];return chQ(`Beide reeksen hebben mediaan 4. Welke uitspraak klopt?`,["Ze moeten ook hetzelfde gemiddelde hebben","Ze kunnen een ander gemiddelde en andere spreiding hebben","Alle waarden moeten hetzelfde zijn"],1,"De mediaan vertelt alleen iets over het midden.","De reeksen kunnen ondanks dezelfde mediaan sterk verschillen.")},
()=>{let arr=[30,31,32,33,80];let avg=arr.reduce((a,b)=>a+b,0)/5;return chQ(`Reeks: ${arr.join(", ")}. Welke maat zal door de 80 het sterkst omhooggetrokken worden?`,["Gemiddelde","Mediaan"],0,"Een uitschieter telt volledig mee in de som.","Het gemiddelde is gevoeliger voor de uitschieter.")}
);
TOPICS.sc5.qs.gold.push(
()=>{let opts=["7, 9, 10, 19, 25","8, 9, 10, 14, 19","10, 10, 10, 10, 30"];return chQ(`Welke reeks heeft mediaan 10 en gemiddelde 14?`,opts,0,"Bij vijf getallen met gemiddelde 14 moet de som 70 zijn.","7+9+10+19+25=70 en de middelste waarde is 10.")},
()=>{let base=[9,10,11,12,13],ext=55;return chQ(`Aan ${base.join(", ")} voeg je ${ext} toe. Wat verwacht je vóór je rekent?`,["Het gemiddelde verandert sterker dan de mediaan","De mediaan verandert sterker dan het gemiddelde","Beide blijven gelijk"],0,"De extreme waarde beïnvloedt de som sterk.","Het gemiddelde reageert sterker op de uitschieter.")},
()=>{let arr=[5,6,6,7,36];let avg=12,med=6;return chQ(`Een sportgroep registreert ${arr.join(", ")} km. Iemand zegt: “Een gewone training is 12 km, want dat is het gemiddelde.” Hoe beoordeel je dat?`,["Goed: gemiddelde is altijd de beste maat","Twijfelachtig: mediaan 6 km ligt dichter bij vier van de vijf trainingen"],1,"Vergelijk beide maten met de meeste waarnemingen.","De mediaan geeft hier een veel representatiever beeld.")}
);

// ---- SC6 extra ----
TOPICS.sc6.qs.bronze.push(
()=>{let n=choice([6,8,10]),price=choice([4,5,6]),ans=n*price;return numQ(`${n} leerlingen betalen elk €${price}. Hoeveel betalen ze samen?`,ans,"euro","Aantal × prijs per leerling.",`${n} × €${price} = €${ans}.`)},
()=>{let total=choice([48,60,72]),used=choice([18,24,30]),ans=total-used;return numQ(`Een voorraad bevat ${total} liter. Er wordt ${used} liter gebruikt. Hoeveel liter blijft over?`,ans,"liter","Trek de gebruikte hoeveelheid af van het totaal.",`${total} − ${used} = ${ans} liter.`)},
()=>{let people=choice([13,14,15,16]),per=2,ans=people*per;return numQ(`Voor ${people} personen zijn elk ${per} broodjes nodig. Hoeveel broodjes heb je in totaal nodig?`,ans,"broodjes","Aantal personen × broodjes per persoon.",`${people} × ${per} = ${ans}.`)}
);
TOPICS.sc6.qs.silver.push(
()=>{let people=choice([18,22,26]),per=0.75,bottle=1.5,total=people*per,ans=Math.ceil(total/bottle);return numQ(`Voor ${people} sporters reken je ${String(per).replace(".",",")} L drank per persoon. Flessen bevatten ${String(bottle).replace(".",",")} L. Hoeveel flessen koop je minstens?`,ans,"flessen","Bereken eerst de totale liters, deel door 1,5 en rond naar boven.",`${people} × ${per} = ${total} L. ${total} ÷ ${bottle} = ${round2(total/bottle)} → ${ans}.`)},
()=>{let budget=150,price=choice([84,96,108]),disc=25,extra=choice([28,35,42]),newp=price*.75,left=round2(budget-newp-extra);return numQ(`Je hebt €${budget}. Een jas van €${price} krijgt ${disc}% korting. Je koopt ook schoenen van €${extra}. Hoeveel geld blijft over?`,left,"euro","Bereken eerst de nieuwe jasprijs, tel de schoenen erbij en vergelijk met het budget.",`Jas = ${euro(newp)}. Totaal = ${euro(newp+extra)}. Over = ${euro(left)}.`)},
()=>{let total=choice([105,120,135]),first=choice([30,45]),p=50,remain=total-first,second=remain*.5,ans=remain-second;return numQ(`Een tocht is ${total} km. Je rijdt eerst ${first} km. Daarna rijd je 50% van de resterende afstand. Hoeveel kilometer blijft nog over?`,ans,"km","Trek eerst de eerste afstand af. Neem daarna de helft van wat rest.",`Na deel 1 blijft ${remain} km. Daarna rijd je ${second} km. Over = ${ans} km.`)},
()=>{let n=choice([15,17,19]),g=choice([160,180,200]),pack=500,total=n*g,ans=Math.ceil(total/pack);return numQ(`Voor ${n} personen is ${g} g rijst per persoon nodig. Pakken bevatten ${pack} g. Hoeveel pakken koop je minstens?`,ans,"pakken","Bereken eerst het totaal in gram.",`${n} × ${g} = ${total} g. ${total} ÷ ${pack} = ${round2(total/pack)} → ${ans} pakken.`)},
()=>{let people=choice([25,28,31]),cap=8,cost=75,vans=Math.ceil(people/cap),ans=vans*cost;return numQ(`${people} personen reizen met busjes van ${cap} plaatsen. Eén busje kost €${cost}. Wat kosten de nodige busjes samen?`,ans,"euro","Bereken eerst hoeveel busjes je minstens nodig hebt.",`${people} ÷ ${cap} → ${vans} busjes. ${vans} × €${cost} = €${ans}.`)}
);
TOPICS.sc6.qs.gold.push(
()=>{let n=50,buy=18,damage=12,sell=30,damaged=n*damage/100,sold=n-damaged,cost=n*buy,revenue=sold*sell,diff=revenue-cost;return numQ(`Een winkel koopt ${n} stuks aan €${buy}. ${damage}% raakt beschadigd. De rest wordt verkocht voor €${sell}. Hoeveel euro ligt de verkoopopbrengst boven de aankoopkost?`,diff,"euro","Bereken aankoopkost, beschadigde stuks, verkochte stuks en opbrengst.",`Aankoop €${cost}; beschadigd ${damaged}; verkocht ${sold}; opbrengst €${revenue}; verschil €${diff}.`)},
()=>{let total=180,first=60,p=65,remain=total-first,second=remain*p/100,ans=remain-second;return numQ(`Een route is ${total} km. Je legt eerst ${first} km af. Daarna doe je ${p}% van de resterende afstand. Hoeveel kilometer blijft er over?`,ans,"km","Pas het percentage toe op de resterende afstand, niet op het oorspronkelijke totaal.",`Na ${first} km blijft ${remain}. ${p}% daarvan = ${second}. Over = ${ans} km.`)},
()=>{let people=34,cap=9,cost=92,km=47,vans=Math.ceil(people/cap),ans=vans*cost;return chQ(`${people} personen moeten vervoerd worden. Een busje heeft ${cap} plaatsen en kost €${cost}. De rit is ${km} km. Welke informatie is niet nodig om de totale huurkost te berekenen?`,[`${people} personen`,`€${cost} per busje`,`${km} km ritafstand`],2,"De huurprijs is per busje, niet per kilometer.",`Je hebt ${vans} busjes nodig. Kost = €${ans}. De ${km} km is overbodig.`)}
);

const STORE_KEY="wiskracht_lab_v1";
let state=JSON.parse(localStorage.getItem(STORE_KEY)||'{"attempts":[]}');
let current={topic:null,level:null,q:null,selected:null,mixed:false,mixLeft:0};

function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state))}
function logAttempt(topic,level,correct){state.attempts.push({topic,level,correct,ts:new Date().toISOString()});save()}
function stats(topic,level="silver"){
  const a=state.attempts.filter(x=>x.topic===topic&&x.level===level);
  return {n:a.length,ok:a.filter(x=>x.correct).length,pct:a.length?Math.round(a.filter(x=>x.correct).length/a.length*100):0};
}
function mastery(topic){
  const s=stats(topic,"silver"); if(s.n<5)return "Nog oefenen"; if(s.pct>=80)return "Zilver beheerst"; if(s.pct>=60)return "Op weg"; return "Extra oefenen";
}

function goHome(){
  current={topic:null,level:null,q:null,selected:null,mixed:false,mixLeft:0};
  let cards=Object.entries(TOPICS).map(([id,t])=>{
    const s=stats(id,"silver");
    return `<div class="topic-card">
      <div class="code">${t.code}</div><h3>${t.short}</h3>
      <div class="criterion">${t.criterion}</div>
      <div class="muted">Zilver: ${s.n?`${s.ok}/${s.n} juist (${s.pct}%)`:"nog niet geoefend"} · ${mastery(id)}</div>
      <div class="progressbar"><span style="width:${s.pct}%"></span></div>
      <div class="actions"><button class="btn primary" onclick="showTopic('${id}')">Theorie & oefenen</button><button class="btn silver" onclick="startPractice('${id}','silver')">Start Zilver</button></div>
    </div>`;
  }).join("");
  document.getElementById("app").innerHTML=`
    <section class="hero">
      <h1>Wiskracht LAB</h1>
      <p>Oefen dezelfde wiskundige vaardigheden als in de les, met telkens nieuwe getallen en contexten.</p>
      <div class="level-strip">
        <div class="level"><strong>Brons</strong>Extra steun. Eén vaardigheid per keer en duidelijke tussenstappen.<br><span class="note">36 oefentemplates</span></div>
        <div class="level"><strong>Zilver</strong><b>Dit niveau moet je beheersen.</b> Herkenbare context, zelf de aanpak kiezen en geregeld meerdere stappen.<br><span class="note">60 oefentemplates</span></div>
        <div class="level"><strong>Goud</strong>Combineer, beoordeel en selecteer zelf relevante informatie.<br><span class="note">36 oefentemplates</span></div>
      </div>
      <div class="actions"><button class="btn primary" onclick="startMixed()">Oefen een Zilvermix</button></div>
    </section>
    <section class="topics">${cards}</section>
    <div class="footer-note">Je voortgang wordt alleen op dit toestel en in deze browser bewaard. De kern van de app werkt zonder internet; videolinks openen extern.</div>`;
}
function showTopic(id){
  const t=TOPICS[id]; current.topic=id;
  document.getElementById("app").innerHTML=`
    <section class="panel">
      <div class="code">${t.code}</div><h1>${t.title}</h1>
      <p><strong>Succescriterium:</strong> ${t.criterion}</p>
    </section>
    <section class="panel">
      <h2>Theorie</h2>
      <div class="theory-grid"><div>${t.theory}</div><div>
        <h3>Uitlegvideo${t.videos.length===1?"":"’s"}</h3>
        ${t.videos.length?`<div class="video-grid">${t.videos.map(v=>`
          <div class="video-card">
            <iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/${v[2]}" title="${v[0]}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            <div class="video-info"><strong>${v[0]}</strong><div class="video-note">${v[3]||""}</div><a target="_blank" rel="noopener" href="${v[1]}">Open op YouTube</a></div>
          </div>`).join("")}</div>`:`<p class="muted">Bij dit onderdeel is de korte uitleg in de app zelf nuttiger dan een extra filmpje.</p>`}
        <p class="note">De video’s zijn aanvullend en vragen internet. Lukt afspelen in de app niet door de schoolfilter, gebruik dan ‘Open op YouTube’.</p>
      </div></div>
    </section>
    <section class="panel"><h2>Kies je niveau</h2>
      <p>Start bij <strong>Zilver</strong>. Loop je vast? Ga tijdelijk naar Brons en keer daarna terug naar Zilver.</p>
      <div class="level-buttons">
        <button class="btn bronze" onclick="startPractice('${id}','bronze')">Brons · extra steun</button>
        <button class="btn silver" onclick="startPractice('${id}','silver')">Zilver · vereist niveau</button>
        <button class="btn gold" onclick="startPractice('${id}','gold')">Goud · uitdaging</button>
      </div>
    </section>`;
}
function startPractice(topic,level){
  current={topic,level,q:null,selected:null,mixed:false,mixLeft:0};
  nextQuestion();
}
function startMixed(){
  current={topic:null,level:"silver",q:null,selected:null,mixed:true,mixLeft:10,mixDone:0,mixOk:0,mixSkipped:0};
  nextQuestion();
}
function nextQuestion(){
  if(current.mixed && current.mixLeft<=0){return showMixResult()}
  let topic=current.topic;
  if(current.mixed) topic=choice(Object.keys(TOPICS));
  const arr=TOPICS[topic].qs[current.level];
  current.topic=topic; current.selected=null; current.q=choice(arr)();
  renderQuestion();
}
function renderQuestion(){
  const t=TOPICS[current.topic],q=current.q,levelLabel={bronze:"Brons",silver:"Zilver",gold:"Goud"}[current.level];
  let answer="";
  if(q.type==="number"){
    answer=`<div class="answer-row"><input id="numAns" inputmode="decimal" placeholder="jouw antwoord"><span>${q.unit||""}</span><button class="btn primary" onclick="checkAnswer()">Controleer</button></div>`;
  }else{
    answer=`<div class="choice-list">${q.options.map((o,i)=>`<button class="choice" id="choice${i}" onclick="selectChoice(${i})">${o}</button>`).join("")}</div><div class="answer-row"><button class="btn primary" onclick="checkAnswer()">Controleer</button></div>`;
  }
  document.getElementById("app").innerHTML=`
    <section class="question-card">
      <div class="question-head">
        <div><div class="code">${t.code}</div><h2>${t.short}</h2></div>
        <div class="pill">${current.mixed?`Zilvermix · nog ${current.mixLeft}`:levelLabel}</div>
      </div>
      <div class="prompt">${q.prompt}</div>
      ${q.visual?`<div class="visual">${q.visual}</div>`:""}
      ${answer}
      <div class="actions" style="margin-top:12px">
        <button class="btn soft" onclick="showHint()">Hint</button>
        <button class="btn soft" onclick="showSolution()">Toon uitwerking</button>
        <button class="btn soft" onclick="skipQuestion()">Overslaan</button>
        ${!current.mixed&&current.level==="silver"?`<button class="btn bronze" onclick="startPractice('${current.topic}','bronze')">Even naar Brons</button>`:""}
        <button class="btn" onclick="${current.mixed?'goHome()':`showTopic('${current.topic}')`}">Stop</button>
      </div>
      <div id="feedback"></div>
    </section>`;
}
function selectChoice(i){
  current.selected=i;
  document.querySelectorAll(".choice").forEach((el,j)=>el.classList.toggle("selected",i===j));
}
function parseNum(v){return Number(String(v).trim().replace(",",".").replace(/[^\d.\-]/g,""))}
function checkAnswer(){
  const q=current.q; let correct=false;
  if(q.type==="number"){
    const el=document.getElementById("numAns"),v=parseNum(el.value);
    if(Number.isNaN(v)) return showFeedback("Vul eerst een getal in.","hint");
    correct=Math.abs(v-q.answer)<=q.tolerance;
  }else{
    if(current.selected===null) return showFeedback("Kies eerst een antwoord.","hint");
    correct=current.selected===q.answerIndex;
  }
  logAttempt(current.topic,current.level,correct);
  if(current.mixed){current.mixDone++; if(correct)current.mixOk++; current.mixLeft--}
  if(correct){
    showFeedback(`<strong>Juist.</strong><div class="solution">${q.solution}</div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="nextQuestion()">Volgende oefening</button></div>`,"ok");
  }else{
    showFeedback(`<strong>Nog niet.</strong> Bekijk je aanpak opnieuw. <button class="btn soft" style="margin-left:8px" onclick="showHint()">Toon hint</button>`,"bad");
  }
}
function skipQuestion(){
  if(current.mixed){
    current.mixSkipped=(current.mixSkipped||0)+1;
  }
  nextQuestion();
}
function showHint(){showFeedback(`<strong>Hint:</strong> ${current.q.hint}`,"hint")}
function showSolution(){showFeedback(`<strong>Uitwerking:</strong><div class="solution">${current.q.solution}</div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="nextQuestion()">Volgende oefening</button></div>`,"hint")}
function showFeedback(html,kind){document.getElementById("feedback").innerHTML=`<div class="feedback ${kind}">${html}</div>`}
function showMixResult(){
  document.getElementById("app").innerHTML=`<section class="hero"><h1>Zilvermix klaar</h1><div class="stat-big">${current.mixOk}/${current.mixDone}</div><p>Je hebt ${current.mixOk} van de ${current.mixDone} beantwoorde oefeningen bij de eerste controle juist.</p>
      <p class="muted">Overgeslagen oefeningen tellen niet mee in je score${current.mixSkipped?` (${current.mixSkipped} overgeslagen)`:``}.</p><div class="actions"><button class="btn primary" onclick="startMixed()">Nieuwe Zilvermix</button><button class="btn" onclick="goHome()">Terug naar start</button></div></section>`;
}
function showTeacher(){
  let rows=Object.entries(TOPICS).map(([id,t])=>{
    const b=stats(id,"bronze"),s=stats(id,"silver"),g=stats(id,"gold");
    return `<tr><td>${t.code} · ${t.short}</td><td>${b.n?b.pct+"% ("+b.n+")":"-"}</td><td><strong>${s.n?s.pct+"% ("+s.n+")":"-"}</strong></td><td>${g.n?g.pct+"% ("+g.n+")":"-"}</td><td>${mastery(id)}</td></tr>`;
  }).join("");
  const all=state.attempts,ok=all.filter(x=>x.correct).length;
  document.getElementById("app").innerHTML=`
    <section class="hero"><h1>Mijn voortgang</h1><p>Deze gegevens staan alleen lokaal in deze browser.</p>
      <div class="stats"><div class="stat-card"><div class="stat-big">${all.length}</div>pogingen</div><div class="stat-card"><div class="stat-big">${all.length?Math.round(ok/all.length*100):0}%</div>juist</div></div>
    </section>
    <section class="panel"><table><thead><tr><th>Doel</th><th>Brons</th><th>Zilver</th><th>Goud</th><th>Indicatie</th></tr></thead><tbody>${rows}</tbody></table></section>
    <section class="panel"><div class="actions"><button class="btn" onclick="exportCSV()">Exporteer CSV</button><button class="btn" onclick="resetProgress()">Wis lokale voortgang</button><button class="btn primary" onclick="goHome()">Terug</button></div></section>`;
}
function exportCSV(){
  let rows=[["tijd","succescriterium","niveau","juist"]];
  state.attempts.forEach(a=>rows.push([a.ts,TOPICS[a.topic].code,a.level,a.correct?"ja":"nee"]));
  const csv=rows.map(r=>r.join(";")).join("\n");
  const blob=new Blob([csv],{type:"text/csv"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="wiskracht_voortgang.csv";a.click();URL.revokeObjectURL(url);
}
function resetProgress(){
  if(confirm("Wil je de lokale voortgang op dit toestel wissen?")){state={attempts:[]};save();showTeacher()}
}

goHome();
</script>
